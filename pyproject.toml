[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ux-behavior"
version = "0.3.1"
description = "Standard Channel interface for product behavior: Component + actions + Morph/Ref state → verified Ops."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "bitplorer" }]
keywords = ["ux", "server-driven-ui", "ops", "composition", "behavior", "channel"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
channel = ["ux-channel>=0.1"]

[project.scripts]
uxbehavior = "ux_behavior.cli:main"

[project.urls]
Homepage = "https://github.com/bitplorer/ux-behavior"
Repository = "https://github.com/bitplorer/ux-behavior"
Documentation = "https://github.com/bitplorer/ux-behavior/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ux_behavior = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = [
  "ignore::DeprecationWarning",
]

# Features registry (curated). scripts/codemap.py validates every reference:
# modules must be mapped, ``symbols`` (``module:Name`` or ``module:Class.method``)
# must resolve, and ``tests`` / ``docs`` paths must exist. The validated entries
# are folded into codemap/index.json, and each module shard lists its features.
# Edit this file in the same PR that moves a feature. See CODEMAP.md.

[[feature]]
id = "composition-root"
purpose = "Behavior boots, registers Components and dispatches `component.method` to verified list[Op], sync and async."
modules = ["ux_behavior.root", "ux_behavior.local"]
symbols = [
  "ux_behavior.root:Behavior.boot",
  "ux_behavior.root:Behavior.add",
  "ux_behavior.root:Behavior.dispatch",
  "ux_behavior.root:Behavior.async_dispatch",
  "ux_behavior.root:Behavior.refresh",
  "ux_behavior.local:LocalRuntime",
]
tests = [
  "tests/test_dispatch.py",
  "tests/test_refresh.py",
  "tests/test_local.py",
  "tests/test_every_mode.py",
]
docs = ["docs/reference/DISPATCH.md", "docs/internals/INTERNALS.md"]

[[feature]]
